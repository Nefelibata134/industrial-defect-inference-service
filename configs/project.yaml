project:
  name: industrial-defect-inference-service
  seed: 42

dataset:
  name: Severstal Steel Defect Detection
  task: semantic_segmentation
  expected_images: 12568
  expected_annotation_rows: 7095
  expected_image_size: [1600, 256]
  splits: [train, val, test]
  split_ratio: [0.7, 0.15, 0.15]
  classes:
    - defect_1
    - defect_2
    - defect_3
    - defect_4

training:
  model: unet_resnet18
  image_size: [1024, 256]
  epochs: 60
  batch: 8
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 4
  amp: true
  threshold: 0.5
  patience: 10
  loss:
    - binary_cross_entropy
    - dice

deployment:
  checkpoint: models/class_aware_p075_e05_best_unet_resnet18.pt
  onnx_model: models/unet_resnet18_severstal.onnx
  onnx_opset: 18
  tensorrt_fp32_engine: models/unet_resnet18_severstal_fp32.plan
  tensorrt_fp16_engine: models/unet_resnet18_severstal_fp16.plan
  tensorrt_profile_batch: [1, 4, 8]
  tensorrt_workspace_gib: 2
  threshold: 0.80
  input_name: images
  output_name: logits
  dynamic_batch: true

evaluation:
  primary_metric: macro_dice
  quality_metrics:
    - per_class_dice
    - macro_dice
    - per_class_iou
    - macro_iou
    - precision
    - recall
    - image_false_negative_rate
  deployment_metrics:
    - mean_latency_ms
    - p50_latency_ms
    - p95_latency_ms
    - p99_latency_ms
    - throughput_fps
    - gpu_memory_mb
    - model_size_mb

serving:
  max_batch_size: 8
  preferred_batch_sizes: [2, 4, 8]
  max_queue_delay_microseconds: 1000
  request_timeout_seconds: 5
