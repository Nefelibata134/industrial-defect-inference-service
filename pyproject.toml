[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-defect-inference-service"
version = "0.1.0"
description = "Train, optimize, serve, and benchmark an industrial defect segmentation service."
readme = "README.md"
requires-python = ">=3.10,<3.11"
authors = [{ name = "Nefelibata134" }]
dependencies = [
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.10,<6",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
data = [
    "kaggle>=1.7.4,<2",
]
train = [
    "albumentations>=2,<3",
    "matplotlib>=3.9,<4",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "segmentation-models-pytorch>=0.5,<1",
    "tqdm>=4.67,<5",
]
export = [
    "onnx>=1.17,<2",
    "onnxruntime>=1.20,<2",
    "onnxscript>=0.5,<1",
]
tensorrt = [
    "cuda-python>=12.9,<13",
    "tensorrt-cu12==10.9.0.34; platform_system == 'Linux' and platform_machine == 'x86_64'",
]
service = [
    "fastapi>=0.115,<1",
    "prometheus-client>=0.21,<1",
    "python-multipart>=0.0.20,<1",
    "tritonclient[http]==2.56.0",
    "uvicorn[standard]>=0.34,<1",
]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
